<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobooth Lucu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a4a;
    --pink:#ff8fb8;
    --pink-soft:#ffd6e6;
    --yellow:#ffe27a;
    --sky:#8fd3ff;
    --mint:#a8ebc4;
    --paper:#fffafc;
    --bg:#ffe3ef;
    --font:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font);
    color:var(--ink);
    background-color:var(--bg);
    background-image:radial-gradient(rgba(255,143,184,.35) 2px,transparent 2.5px);
    background-size:26px 26px;
    min-height:100vh;
  }
  .app{
    max-width:1080px;margin:0 auto;padding:28px 22px 48px;
    display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    gap:18px 36px;align-items:start;
  }
  .top{grid-column:1/-1;text-align:center;padding-bottom:4px}
  .top h1{
    margin:0;font-size:clamp(2.4rem,6vw,3.8rem);font-weight:700;letter-spacing:.01em;
    color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
    text-shadow:4px 4px 0 var(--pink),5px 5px 0 var(--ink);
  }
  .top p{margin:10px 0 0;font-size:1.05rem;font-weight:500}

  /* ---------- Bilik kamera ---------- */
  .booth{
    position:relative;border:4px solid var(--ink);border-radius:30px;background:var(--paper);
    padding:46px 16px 14px;box-shadow:0 8px 0 var(--ink);
  }
  .curtain{
    position:absolute;left:0;right:0;top:0;height:40px;border-radius:26px 26px 0 0;overflow:hidden;
    background:
      radial-gradient(circle at 50% 0,var(--pink) 0 17px,var(--ink) 17px 20px,transparent 20.5px) 0 0/40px 40px repeat-x;
  }
  .screen{
    position:relative;aspect-ratio:4/3;border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:#2a1d35;
  }
  .screen video{width:100%;height:100%;object-fit:cover;display:block}
  .screen video.mirror{transform:scaleX(-1)}
  .count{
    position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
    font-size:clamp(6rem,22vw,11rem);font-weight:700;color:#fff;
    -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--pink);
  }
  .count.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .45s ease-out}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .msg{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:20px;text-align:center;color:#fff;background:rgba(42,29,53,.88);font-weight:500;line-height:1.4;
  }
  .msg.show{display:flex}
  .shot-label{
    margin:12px 0 0;text-align:center;font-weight:600;font-size:1.05rem;
  }

  /* ---------- Tombol ---------- */
  .btn{
    font:600 1rem/1 var(--font);color:var(--ink);background:#fff;
    border:3px solid var(--ink);border-radius:999px;padding:12px 22px;cursor:pointer;
    box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--ink)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
  .btn.big{display:block;width:100%;margin-top:22px;font-size:1.35rem;padding:16px 22px;background:var(--yellow)}
  .btn.pink{background:var(--pink)}
  .btn.ghost{background:var(--paper)}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  /* ---------- Pengaturan ---------- */
  .controls{margin-top:24px;display:grid;gap:18px}
  fieldset{border:0;margin:0;padding:0;min-width:0}
  legend{padding:0;margin-bottom:8px;font-weight:600;font-size:.98rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font:500 .95rem/1 var(--font);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;
    padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  }
  .chip[aria-pressed="true"]{background:var(--yellow);box-shadow:0 3px 0 var(--ink);transform:translateY(-2px);font-weight:600}
  .chip i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
  .row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:end}
  .field{display:grid;gap:6px}
  .field input[type=text]{
    font:500 1rem var(--font);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:9px 12px;background:#fff;width:210px;
  }
  .check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
  .check input{width:20px;height:20px;accent-color:var(--pink)}

  /* ---------- Strip ---------- */
  .strip-col{position:sticky;top:20px;text-align:center}
  .paper{
    display:inline-block;padding:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;
    box-shadow:6px 6px 0 var(--ink);transform:rotate(1.5deg);
  }
  .paper canvas{display:block;max-height:72vh;max-width:100%;width:auto;height:auto;border-radius:6px}
  .actions{display:flex;gap:12px;justify-content:center;margin-top:24px}
  .gallery{display:inline-block;margin-top:18px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .gallery input{position:absolute;opacity:0;width:1px;height:1px}
  .gallery:focus-within{outline:3px solid var(--ink);outline-offset:3px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;padding:20px 14px 40px}
    .strip-col{position:static}
    .paper canvas{max-height:none;width:100%;max-width:340px}
  }
  @media (prefers-reduced-motion:reduce){
    .count.pop,.flash.go{animation:none}
    .btn{transition:none}
  }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>yasirphotobooth</h1>
    <p>Ambil beberapa foto, jadikan satu strip lucu, lalu simpan ke perangkatmu.</p>
  </header>

  <section aria-label="Kamera">
    <div class="booth">
      <div class="curtain" aria-hidden="true"></div>
      <div class="screen">
        <video id="video" class="mirror" playsinline muted autoplay></video>
        <div class="count" id="count" aria-live="assertive"></div>
        <div class="flash" id="flash"></div>
        <div class="msg show" id="msg">Mengaktifkan kamera…</div>
      </div>
      <p class="shot-label" id="shotLabel">Menunggu kamera</p>
    </div>

    <button class="btn big" id="start" disabled>Mulai foto</button>

    <div class="controls">
      <fieldset>
        <legend>Bingkai</legend>
        <div class="chips" id="themeChips"></div>
      </fieldset>
      <fieldset>
        <legend>Filter</legend>
        <div class="chips" id="filterChips"></div>
      </fieldset>
      <div class="row">
        <fieldset>
          <legend>Jumlah foto</legend>
          <div class="chips" id="countChips"></div>
        </fieldset>
        <fieldset>
          <legend>Hitung mundur</legend>
          <div class="chips" id="timerChips"></div>
        </fieldset>
      </div>
      <div class="row">
        <div class="field">
          <label for="caption">Tulisan di strip</label>
          <input type="text" id="caption" maxlength="18" value="photobooth" autocomplete="off">
        </div>
        <label class="check"><input type="checkbox" id="mirror" checked> Mode cermin</label>
      </div>
    </div>
  </section>

  <aside class="strip-col" aria-label="Hasil strip foto">
    <div class="paper"><canvas id="strip"></canvas></div>
    <div class="actions">
      <button class="btn pink" id="download" disabled>Simpan foto</button>
      <button class="btn ghost" id="reset">Ulangi</button>
    </div>
    <label class="gallery">Pakai foto dari galeri
      <input type="file" id="gallery" accept="image/*" multiple>
    </label>
  </aside>
</main>

<script>
(() => {
  'use strict';

  /* ---------- Ukuran strip (dalam satuan logis, digambar 2x biar tajam) ---------- */
  const S = 2;
  const W = 600, PAD = 44, PW = 512, PH = 384, GAP = 22, HEAD = 100, FOOT = 116;
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const FONT = 'Fredoka,"Trebuchet MS",sans-serif';

  /* ---------- Gambar bentuk ---------- */
  function heart(c, x, y, s) {
    c.beginPath();
    c.moveTo(x, y + s * .35);
    c.bezierCurveTo(x, y - s * .1, x - s * .6, y - s * .1, x - s * .6, y + s * .3);
    c.bezierCurveTo(x - s * .6, y + s * .65, x - s * .1, y + s * .85, x, y + s * 1.05);
    c.bezierCurveTo(x + s * .1, y + s * .85, x + s * .6, y + s * .65, x + s * .6, y + s * .3);
    c.bezierCurveTo(x + s * .6, y - s * .1, x, y - s * .1, x, y + s * .35);
    c.closePath(); c.fill();
  }
  function star(c, x, y, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
      c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    c.closePath(); c.fill();
  }
  function cloud(c, x, y, s) {
    c.beginPath();
    c.arc(x, y, 16 * s, 0, Math.PI * 2);
    c.arc(x + 20 * s, y - 11 * s, 21 * s, 0, Math.PI * 2);
    c.arc(x + 42 * s, y, 16 * s, 0, Math.PI * 2);
    c.fill();
    c.fillRect(x, y, 42 * s, 16 * s);
  }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  /* ---------- Tema bingkai ---------- */
  const THEMES = {
    pink: {
      name: 'Pita pink', swatch: '#ffb3d1', fg: '#6b2146', edge: '#ffffff',
      stickers: ['🎀', '💖', '✨', '🍓'],
      paint(c, w, h) {
        c.fillStyle = '#ffb3d1'; c.fillRect(0, 0, w, h);
        c.fillStyle = 'rgba(255,255,255,.5)';
        for (let y = 20, r = 0; y < h; y += 44, r++)
          for (let x = (r % 2 ? 20 : 42); x < w; x += 44) heart(c, x, y, 13);
      }
    },
    sky: {
      name: 'Langit awan', swatch: '#8fd3ff', fg: '#1f4f7a', edge: '#ffffff',
      stickers: ['☁️', '⭐', '🌈', '🦋'],
      paint(c, w, h) {
        const g = c.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#8fd3ff'); g.addColorStop(1, '#e3f5ff');
        c.fillStyle = g; c.fillRect(0, 0, w, h);
        c.fillStyle = 'rgba(255,255,255,.95)';
        for (let y = 62, k = 0; y < h; y += 118, k++) cloud(c, k % 2 ? w - 70 : 12, y, .8);
        c.fillStyle = '#ffe27a';
        for (let y = 30, k = 0; y < h; y += 96, k++) star(c, k % 2 ? 22 : w - 22, y + 40, 9);
      }
    },
    bear: {
      name: 'Beruang madu', swatch: '#ffe27a', fg: '#5b3a12', edge: '#ffffff',
      stickers: ['🐻', '🍯', '🧸', '🌼'],
      paint(c, w, h) {
        c.fillStyle = '#ffe27a'; c.fillRect(0, 0, w, h);
        c.fillStyle = '#ffd04a';
        for (let y = 16, r = 0; y < h + 20; y += 38, r++)
          for (let x = (r % 2 ? 0 : 19); x < w + 20; x += 38) { c.beginPath(); c.arc(x, y, 9, 0, Math.PI * 2); c.fill(); }
      }
    },
    mint: {
      name: 'Gingham mint', swatch: '#a8ebc4', fg: '#1d5a3d', edge: '#ffffff',
      stickers: ['🍀', '🍓', '🐸', '🌸'],
      paint(c, w, h) {
        c.fillStyle = '#b9f0d1'; c.fillRect(0, 0, w, h);
        c.fillStyle = 'rgba(255,255,255,.55)';
        for (let x = 0; x < w; x += 48) c.fillRect(x, 0, 24, h);
        for (let y = 0; y < h; y += 48) c.fillRect(0, y, w, 24);
      }
    },
    film: {
      name: 'Film klasik', swatch: '#2b2530', fg: '#f4efe6', edge: '#f4efe6',
      stickers: [],
      paint(c, w, h) {
        c.fillStyle = '#1d1922'; c.fillRect(0, 0, w, h);
        c.fillStyle = '#efe9f5';
        for (let y = 16; y < h; y += 34) {
          rr(c, 13, y, 17, 22, 4); c.fill();
          rr(c, w - 30, y, 17, 22, 4); c.fill();
        }
      }
    }
  };

  /* ---------- Filter foto (dihitung per piksel supaya jalan di semua browser) ---------- */
  const lift = (v, k, add) => (v - 128) * k + 128 + add;
  const FILTERS = {
    normal:  { name: 'Natural',      css: 'none', fn: null },
    pinky:   { name: 'Pinky',        css: 'saturate(1.15) brightness(1.06)', fn: (r, g, b) => [r * 1.05 + 14, g * .98 + 6, b * 1.02 + 12] },
    dreamy:  { name: 'Dreamy',       css: 'brightness(1.08) contrast(.92) saturate(1.1)', fn: (r, g, b) => [lift(r, .9, 14), lift(g, .9, 12), lift(b, .9, 20)] },
    vintage: { name: 'Jadul',        css: 'sepia(.55) contrast(.95) saturate(1.2)', fn: (r, g, b) => {
      const sr = r * .393 + g * .769 + b * .189, sg = r * .349 + g * .686 + b * .168, sb = r * .272 + g * .534 + b * .131;
      return [lift(r * .4 + sr * .6, .95, 4), lift(g * .4 + sg * .6, .95, 0), lift(b * .4 + sb * .6, .95, -4)];
    } },
    bw:      { name: 'Hitam putih',  css: 'grayscale(1) contrast(1.1)', fn: (r, g, b) => { const v = lift(.299 * r + .587 * g + .114 * b, 1.1, 0); return [v, v, v]; } }
  };

  function applyFilter(canvas, key) {
    const f = FILTERS[key];
    if (!f || !f.fn) return;
    const cx = canvas.getContext('2d');
    const img = cx.getImageData(0, 0, canvas.width, canvas.height);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const o = f.fn(d[i], d[i + 1], d[i + 2]);
      d[i] = o[0]; d[i + 1] = o[1]; d[i + 2] = o[2];
    }
    cx.putImageData(img, 0, 0);
  }

  /* ---------- State & elemen ---------- */
  const $ = id => document.getElementById(id);
  const video = $('video'), strip = $('strip'), ctx = strip.getContext('2d');
  const countEl = $('count'), flashEl = $('flash'), msgEl = $('msg'), shotLabel = $('shotLabel');
  const startBtn = $('start'), dlBtn = $('download'), resetBtn = $('reset');
  const captionEl = $('caption'), mirrorEl = $('mirror'), galleryEl = $('gallery');

  const state = { theme: 'pink', filter: 'normal', count: 4, timer: 3 };
  let photos = [];
  let busy = false, cancelled = false, cameraReady = false, stream = null;

  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- Gambar strip ---------- */
  const stripHeight = n => HEAD + n * PH + (n - 1) * GAP + FOOT;

  function sticker(ch, x, y, size, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot * Math.PI / 180);
    ctx.font = size + 'px ' + EMOJI_FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }

  function drawStrip() {
    const n = state.count, H = stripHeight(n), t = THEMES[state.theme];
    strip.width = W * S; strip.height = H * S;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    t.paint(ctx, W, H);

    // judul
    const cap = captionEl.value.trim() || 'photobooth';
    let size = 46;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = t.fg;
    do { ctx.font = '700 ' + size + 'px ' + FONT; size -= 2; } while (ctx.measureText(cap).width > W - 2 * PAD && size > 16);
    ctx.fillText(cap, W / 2, HEAD / 2 + 6);

    // foto
    for (let i = 0; i < n; i++) {
      const x = PAD, y = HEAD + i * (PH + GAP);
      ctx.fillStyle = 'rgba(0,0,0,.2)';
      rr(ctx, x + 6, y + 7, PW, PH, 22); ctx.fill();

      ctx.save();
      rr(ctx, x, y, PW, PH, 22); ctx.clip();
      if (photos[i]) {
        ctx.drawImage(photos[i], x, y, PW, PH);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(x, y, PW, PH);
        ctx.fillStyle = t.fg; ctx.globalAlpha = .55;
        ctx.font = '700 64px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(i + 1), x + PW / 2, y + PH / 2 + 4);
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      ctx.lineWidth = 10; ctx.strokeStyle = t.edge;
      rr(ctx, x, y, PW, PH, 22); ctx.stroke();

      if (t.stickers.length && photos[i]) {
        const a = t.stickers[i % t.stickers.length], b = t.stickers[(i + 2) % t.stickers.length];
        sticker(a, x + PW - 14, y + 12, 50, 14);
        sticker(b, x + 20, y + PH - 8, 46, -12);
      }
    }

    // footer
    const date = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
    ctx.fillStyle = t.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '500 26px ' + FONT;
    ctx.fillText(date, W / 2, H - FOOT / 2 - 6);
    if (t.stickers.length) {
      const xs = [-60, -20, 20, 60];
      xs.forEach((dx, k) => sticker(t.stickers[k % t.stickers.length], W / 2 + dx, H - 28, 26, 0));
    }

    updateButtons();
  }

  /* ---------- Ambil foto dari kamera ---------- */
  function coverDraw(cx, source, sw0, sh0, mirror) {
    const cw = cx.canvas.width, ch = cx.canvas.height, target = cw / ch;
    let sw = sw0, sh = sw0 / target;
    if (sh > sh0) { sh = sh0; sw = sh0 * target; }
    const sx = (sw0 - sw) / 2, sy = (sh0 - sh) / 2;
    cx.save();
    if (mirror) { cx.translate(cw, 0); cx.scale(-1, 1); }
    cx.drawImage(source, sx, sy, sw, sh, 0, 0, cw, ch);
    cx.restore();
  }

  function snap() {
    const c = document.createElement('canvas');
    c.width = PW * S; c.height = PH * S;
    coverDraw(c.getContext('2d'), video, video.videoWidth, video.videoHeight, mirrorEl.checked);
    applyFilter(c, state.filter);
    return c;
  }

  /* ---------- Urutan foto ---------- */
  function showCount(s) {
    countEl.textContent = s;
    countEl.classList.remove('pop'); void countEl.offsetWidth; countEl.classList.add('pop');
  }
  function doFlash() {
    flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
  }

  async function run() {
    if (busy) { cancelled = true; return; }
    busy = true; cancelled = false; photos = [];
    drawStrip();
    startBtn.textContent = 'Batalkan';
    for (let i = 0; i < state.count && !cancelled; i++) {
      shotLabel.textContent = 'Foto ' + (i + 1) + ' dari ' + state.count + ', senyum ya!';
      for (let s = state.timer; s > 0 && !cancelled; s--) { showCount(s); await wait(1000); }
      countEl.textContent = '';
      if (cancelled) break;
      doFlash();
      photos.push(snap());
      drawStrip();
      await wait(800);
    }
    busy = false;
    startBtn.textContent = 'Mulai foto';
    if (cancelled) {
      photos = []; drawStrip();
      shotLabel.textContent = 'Dibatalkan. Siap difoto lagi.';
    } else {
      shotLabel.textContent = 'Selesai! Simpan stripnya di kanan.';
    }
    updateButtons();
  }

  function updateButtons() {
    startBtn.disabled = !cameraReady && !busy;
    dlBtn.disabled = busy || photos.length !== state.count;
    resetBtn.disabled = busy && false;
    [...document.querySelectorAll('.controls .chip')].forEach(b => { b.disabled = busy; });
  }

  /* ---------- Kamera ---------- */
  async function startCamera() {
    msgEl.classList.add('show');
    msgEl.textContent = 'Mengaktifkan kamera…';
    shotLabel.textContent = 'Menunggu kamera';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false
      });
      video.srcObject = stream;
      await video.play();
      cameraReady = true;
      msgEl.classList.remove('show');
      shotLabel.textContent = 'Kamera siap. Tekan “Mulai foto”.';
    } catch (e) {
      cameraReady = false;
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      msgEl.innerHTML = '';
      const p = document.createElement('div');
      p.textContent = denied
        ? 'Kamera belum diizinkan. Klik ikon kamera di address bar, pilih Izinkan, lalu coba lagi.'
        : 'Kamera tidak ditemukan atau tidak bisa dipakai. Kamu tetap bisa memakai foto dari galeri.';
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = 'Coba lagi';
      b.addEventListener('click', startCamera);
      msgEl.append(p, b);
      shotLabel.textContent = 'Kamera belum aktif';
    }
    updateButtons();
  }

  /* ---------- Foto dari galeri ---------- */
  galleryEl.addEventListener('change', async () => {
    const files = [...galleryEl.files].slice(0, state.count);
    if (!files.length || busy) return;
    photos = [];
    for (const f of files) {
      const img = new Image();
      const url = URL.createObjectURL(f);
      await new Promise(r => { img.onload = r; img.onerror = r; img.src = url; });
      const c = document.createElement('canvas');
      c.width = PW * S; c.height = PH * S;
      coverDraw(c.getContext('2d'), img, img.naturalWidth, img.naturalHeight, false);
      applyFilter(c, state.filter);
      URL.revokeObjectURL(url);
      photos.push(c);
    }
    galleryEl.value = '';
    drawStrip();
    shotLabel.textContent = photos.length < state.count
      ? 'Baru ' + photos.length + ' dari ' + state.count + ' foto. Pilih lebih banyak foto untuk melengkapi.'
      : 'Foto dari galeri sudah masuk strip.';
  });

  /* ---------- Simpan ---------- */
  dlBtn.addEventListener('click', () => {
    strip.toBlob(blob => {
      if (!blob) return;
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'photobooth-' + stamp + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }, 'image/png');
  });

  resetBtn.addEventListener('click', () => {
    if (busy) { cancelled = true; return; }
    photos = []; drawStrip();
    shotLabel.textContent = cameraReady ? 'Siap difoto' : 'Kamera belum aktif';
  });

  startBtn.addEventListener('click', run);

  /* ---------- Pilihan (chip) ---------- */
  function chips(containerId, items, key, onPick) {
    const box = $(containerId);
    const render = () => {
      box.innerHTML = '';
      items.forEach(it => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip';
        b.setAttribute('aria-pressed', String(state[key] === it.id));
        if (it.swatch) { const i = document.createElement('i'); i.style.background = it.swatch; b.appendChild(i); }
        b.appendChild(document.createTextNode(it.label));
        b.addEventListener('click', () => { state[key] = it.id; render(); onPick && onPick(); });
        box.appendChild(b);
      });
      updateButtons();
    };
    render();
  }

  chips('themeChips', Object.entries(THEMES).map(([id, t]) => ({ id, label: t.name, swatch: t.swatch })), 'theme', drawStrip);
  chips('filterChips', Object.entries(FILTERS).map(([id, f]) => ({ id, label: f.name })), 'filter', () => {
    video.style.filter = FILTERS[state.filter].css;
  });
  chips('countChips', [{ id: 3, label: '3 foto' }, { id: 4, label: '4 foto' }], 'count', () => {
    photos = photos.slice(0, state.count); drawStrip();
  });
  chips('timerChips', [{ id: 3, label: '3 detik' }, { id: 5, label: '5 detik' }], 'timer');

  mirrorEl.addEventListener('change', () => video.classList.toggle('mirror', mirrorEl.checked));
  captionEl.addEventListener('input', drawStrip);

  /* ---------- Mulai ---------- */
  drawStrip();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 40px Fredoka').then(drawStrip).catch(() => {});
    document.fonts.load('500 26px Fredoka').then(drawStrip).catch(() => {});
  }
  startCamera();
})();
</script>
</body>
</html>
